spring:
  application:
    name: siiapi

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  version: 2.0.0
  api-keys-hashed: ${API_KEYS_HASHED:}
